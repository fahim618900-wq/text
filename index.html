<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Code Editor</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/lib/codemirror.min.css">

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/mode/xml/xml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/mode/css/css.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/mode/javascript/javascript.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/mode/htmlmixed/htmlmixed.js"></script>

<!-- Addons: auto-close brackets/tags, bracket match, active line, comment toggle -->
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/addon/edit/closebrackets.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/addon/edit/closetag.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/addon/edit/matchbrackets.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/addon/selection/active-line.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/addon/comment/comment.js"></script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff;
}

.CodeMirror{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100vh;

    font-family:Consolas,"Courier New",monospace;
    font-size:16px;
    line-height:1.6;

    background:#fff;
    color:#111;
    border:0;
}

.CodeMirror-gutters{
    background:#f7f7f7;
    border-right:1px solid #ddd;
    color:#999;
}

.CodeMirror-linenumber{
    color:#999;
    padding:0 10px 0 8px;
}

.CodeMirror-activeline-background{
    background:#f8f8f8;
}

.CodeMirror-cursor{
    border-left:2px solid #222;
}

.CodeMirror-selected{
    background:#dbeafe!important;
}

/* Syntax colors */
.cm-tag{color:#06c}
.cm-attribute{color:#a31515}
.cm-string{color:#008000}
.cm-property{color:#005cc5}
.cm-keyword{color:#7b1fa2}
.cm-variable{color:#111}
.cm-def{color:#795548}
.cm-number{color:#d84315}
.cm-comment{color:#777}

/* =========================
   Mobile buttons (iOS style)
========================= */
#mobileButtons{
    display:none;
    position:fixed;
    right:14px;
    bottom:14px;
    z-index:5000;
    gap:8px;
    align-items:center;
}

.roundBtn{
    width:34px;
    height:34px;
    padding:0;

    border:0.5px solid rgba(0,0,0,.05);
    border-radius:50%;

    background:rgba(120,120,128,.13);
    -webkit-backdrop-filter:blur(14px) saturate(180%);
    backdrop-filter:blur(14px) saturate(180%);

    color:#1c1c1e;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
    -webkit-tap-highlight-color:transparent;

    box-shadow:0 1px 2px rgba(0,0,0,.05);

    transition:transform .16s ease, background .16s ease;
}

.roundBtn svg{
    width:16px;
    height:16px;
    display:block;
    pointer-events:none;
}

.roundBtn:hover{
    background:rgba(120,120,128,.20);
}

.roundBtn:active{
    transform:scale(.9);
    background:rgba(120,120,128,.26);
}

/* =========================
   Result screen
========================= */
#resultScreen{
    display:none;

    position:fixed;
    inset:0;

    width:100vw;
    height:100vh;

    background:#fff;
    z-index:99999;
}

#resultFrame{
    width:100%;
    height:100%;
    border:0;
    background:#fff;
}

/* Close button (iOS glass style) */
#closeBtn{
    position:absolute;
    top:12px;
    right:12px;

    width:34px;
    height:34px;
    padding:0;

    border:0.5px solid rgba(0,0,0,.06);
    border-radius:50%;

    background:rgba(255,255,255,.78);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    backdrop-filter:blur(16px) saturate(180%);

    color:#1c1c1e;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:100000;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;

    box-shadow:0 2px 8px rgba(0,0,0,.14);

    transition:transform .16s ease, background .16s ease;
}

#closeBtn svg{
    width:15px;
    height:15px;
    display:block;
    pointer-events:none;
}

#closeBtn:active{
    transform:scale(.9);
    background:rgba(255,255,255,.95);
}

/* Mobile */
@media(max-width:600px){

    #mobileButtons{
        display:flex;
    }

    .CodeMirror{
        font-size:16px;
    }

    .CodeMirror-linenumber{
        padding-right:8px;
        padding-left:5px;
    }
}

/* Computer */
@media(min-width:601px){

    #mobileButtons{
        display:none;
    }
}
</style>
</head>

<body>

<textarea id="code"><!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Page</title>

    <style>
        body{
            font-family:Arial;
            text-align:center;
            padding:40px;
        }

        h1{
            color:#0066cc;
        }
    </style>
</head>

<body>

    <h1>Hello World!</h1>
    <p>এখানে HTML, CSS এবং JavaScript একসাথে লিখুন।</p>

    <script>
        console.log("Hello!");
    </script>

</body>
</html></textarea>


<!-- MOBILE BUTTONS -->
<div id="mobileButtons">

    <!-- Full Screen -->
    <button
        class="roundBtn"
        onclick="runFullScreen()"
        title="Full Screen"
        aria-label="Full Screen">

        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor"
             stroke-width="1.7"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
            <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
            <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
        </svg>

    </button>

    <!-- Download -->
    <button
        class="roundBtn"
        onclick="downloadCode()"
        title="Download"
        aria-label="Download">

        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor"
             stroke-width="1.7"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M12 4v10"/>
            <path d="M7.5 10.5 12 15l4.5-4.5"/>
            <path d="M5 19h14"/>
        </svg>

    </button>

</div>


<!-- RESULT -->
<div id="resultScreen">

    <button
        id="closeBtn"
        onclick="closeFullScreen()"
        title="Close"
        aria-label="Close">

        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor"
             stroke-width="1.8"
             stroke-linecap="round">
            <path d="M6 6l12 12"/>
            <path d="M18 6L6 18"/>
        </svg>

    </button>

    <iframe id="resultFrame"></iframe>

</div>


<script>

/* =========================
   Safe localStorage
   (private mode / sandbox এ error দিলেও editor যেন না ভাঙে)
========================= */
function lsGet(k){
    try{ return localStorage.getItem(k); }catch(e){ return null; }
}
function lsSet(k,v){
    try{ localStorage.setItem(k,v); }catch(e){}
}

const isTouch = !window.matchMedia("(pointer:fine)").matches;

const editor = CodeMirror.fromTextArea(
    document.getElementById("code"),
    {
        mode:"htmlmixed",

        lineNumbers:true,
        lineWrapping:false,

        tabSize:2,
        indentUnit:2,
        indentWithTabs:false,
        smartIndent:true,
        electricChars:true,

        autofocus:true,
        viewportMargin:Infinity,

        /* কোড লেখার জন্য: অটো-সংশোধন/স্পেলচেক বন্ধ */
        spellcheck:false,
        autocorrect:false,
        autocapitalize:false,

        /* অটো ক্লোজ ব্র্যাকেট, ট্যাগ, ও ম্যাচিং */
        autoCloseBrackets:true,
        autoCloseTags:true,
        matchBrackets:true,
        styleActiveLine:true,

        extraKeys:{

            /* Computer: Shift + Enter / Ctrl + Enter = Run */
            "Shift-Enter":function(){ runFullScreen(); },
            "Ctrl-Enter":function(){ runFullScreen(); },
            "Cmd-Enter":function(){ runFullScreen(); },

            /* Tab: সিলেকশন থাকলে সব লাইন ইন্ডেন্ট, না থাকলে স্পেস */
            "Tab":function(cm){
                if(cm.somethingSelected()){
                    cm.indentSelection("add");
                }else{
                    cm.replaceSelection(
                        Array(cm.getOption("indentUnit") + 1).join(" "),
                        "end",
                        "+input"
                    );
                }
            },

            /* Shift+Tab: ইন্ডেন্ট কমানো */
            "Shift-Tab":function(cm){
                cm.indentSelection("subtract");
            },

            /* Ctrl + / = comment toggle */
            "Ctrl-/":"toggleComment",
            "Cmd-/":"toggleComment",

            /* Ctrl + D / Ctrl + S = Download (browser এর default বন্ধ) */
            "Ctrl-D":function(){ downloadCode(); },
            "Ctrl-S":function(){ downloadCode(); },
            "Cmd-S":function(){ downloadCode(); }

        }
    }
);


/* =========================
   Auto Save
========================= */
const savedCode = lsGet("liveCode");

if(savedCode !== null){
    editor.setValue(savedCode);
    /* সেভ করা কোড লোড হওয়াকে যেন Ctrl+Z দিয়ে আবার ফিরিয়ে না নেওয়া যায় */
    editor.clearHistory();
}

let saveTimer = null;

function saveNow(){
    clearTimeout(saveTimer);
    saveTimer = null;
    lsSet("liveCode", editor.getValue());
}

editor.on("change",function(){
    /* প্রতিটি কী-প্রেসে নয়, থেমে গেলে সেভ */
    clearTimeout(saveTimer);
    saveTimer = setTimeout(saveNow, 300);
});

/* ট্যাব বন্ধ/ব্যাকগ্রাউন্ডে গেলে শেষ অবস্থা সেভ */
document.addEventListener("visibilitychange",function(){
    if(document.visibilityState === "hidden") saveNow();
});
window.addEventListener("pagehide", saveNow);


/* =========================
   Mobile keyboard: editor উচ্চতা ও বাটন অবস্থান
   (কিবোর্ড খুললে কার্সার যেন কিবোর্ডের নিচে চাপা না পড়ে)
========================= */
const cmWrapper = editor.getWrapperElement();
const mobileButtons = document.getElementById("mobileButtons");

function layout(){

    const vv = window.visualViewport;
    const h = vv ? vv.height : window.innerHeight;
    const top = vv ? vv.offsetTop : 0;

    cmWrapper.style.top = top + "px";
    editor.setSize("100%", h);

    const off = vv
        ? Math.max(0, window.innerHeight - (vv.height + vv.offsetTop))
        : 0;

    mobileButtons.style.bottom = (14 + off) + "px";

    editor.refresh();

    if(editor.hasFocus()){
        editor.scrollIntoView(null, 30);
    }
}

if(window.visualViewport){
    window.visualViewport.addEventListener("resize", layout);
    window.visualViewport.addEventListener("scroll", layout);
}
window.addEventListener("resize", layout);
window.addEventListener("orientationchange", function(){
    setTimeout(layout, 250);
});
layout();


/* =========================
   RUN (Overlay only)
========================= */

let resultOpen = false;

function runFullScreen(){

    const code = editor.getValue();

    const frame =
        document.getElementById("resultFrame");

    const screen =
        document.getElementById("resultScreen");

    saveNow();

    /* ফোনে কিবোর্ড বন্ধ করা */
    if(document.activeElement && document.activeElement.blur){
        document.activeElement.blur();
    }

    frame.srcdoc = code;

    screen.style.display = "block";

    /* ব্যাক বাটনে যেন রেজাল্ট বন্ধ হয় (পেজ থেকে বের হয়ে না যায়) */
    if(!resultOpen){
        try{
            history.pushState({result:1}, "", location.href);
        }catch(e){}
    }

    resultOpen = true;
}


/* =========================
   CLOSE RESULT
========================= */

function hideResult(){

    document.getElementById(
        "resultScreen"
    ).style.display = "none";

    /* চলমান স্ক্রিপ্ট/টাইমার/অডিও বন্ধ করা */
    document.getElementById("resultFrame").srcdoc = "";

    resultOpen = false;

    /* কম্পিউটারে আবার এডিটরে ফোকাস (ফোনে নয়, নইলে কিবোর্ড লাফিয়ে উঠবে) */
    if(!isTouch){
        editor.focus();
    }
}

function closeFullScreen(){

    if(resultOpen && history.state && history.state.result){
        /* popstate ইভেন্ট hideResult() চালাবে */
        history.back();
    }else{
        hideResult();
    }
}

window.addEventListener("popstate", function(){
    if(resultOpen) hideResult();
});

/* Esc চাপলে রেজাল্ট বন্ধ */
document.addEventListener("keydown", function(e){
    if(e.key === "Escape" && resultOpen){
        e.preventDefault();
        closeFullScreen();
    }
});


/* =========================
   DOWNLOAD
========================= */

function downloadCode(){

    const code = editor.getValue();

    /*
     * নাম চাইবে
     */
    let fileName = prompt(
        "ফাইলের নাম লিখুন:",
        "index"
    );

    /*
     * Cancel করলে কিছু হবে না
     */
    if(fileName === null){
        return;
    }

    /* ফাইলনামে নিষিদ্ধ চিহ্ন বাদ */
    fileName = fileName.replace(/[\\\/:*?"<>|]/g, "").trim();

    /*
     * নাম খালি হলে বন্ধ
     */
    if(fileName === ""){
        alert("একটি ফাইলের নাম দিন।");
        return;
    }

    /*
     * ব্যবহারকারী .html লিখলেও
     * আবার .html যোগ হবে না
     */
    if(!fileName.toLowerCase().endsWith(".html")){
        fileName += ".html";
    }

    const blob = new Blob(
        [code],
        {
            type:"text/html;charset=utf-8"
        }
    );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = fileName;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(function(){

        URL.revokeObjectURL(url);

    },1000);
}

</script>

</body>
</html>
