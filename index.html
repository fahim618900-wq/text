<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Code Editor</title>

<!-- CodeMirror -->
<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/lib/codemirror.min.css">

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/lib/codemirror.min.js"></script>

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/mode/xml/xml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/mode/css/css.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/mode/javascript/javascript.js"></script>

<style>

/* =========================
   WHITE EDITOR
========================= */

html,
body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#ffffff;
}


/* =========================
   CODEMIRROR
========================= */

.CodeMirror{
    position:fixed;

    top:0;
    left:0;

    width:100%;
    height:100vh;

    font-family:
        Consolas,
        "Courier New",
        monospace;

    font-size:16px;

    line-height:1.6;

    background:#ffffff;

    color:#111111;

    border:0;
}


/* LINE NUMBER */

.CodeMirror-gutters{
    background:#f7f7f7;

    border-right:1px solid #dddddd;

    color:#999999;
}

.CodeMirror-linenumber{
    color:#999999;

    padding:0 10px 0 8px;
}


/* CURRENT LINE */

.CodeMirror-activeline-background{
    background:#f8f8f8;
}


/* CURSOR */

.CodeMirror-cursor{
    border-left:2px solid #222222;
}


/* SELECTION */

.CodeMirror-selected{
    background:#dbeafe !important;
}


/* =========================
   SYNTAX COLORS
========================= */

/* HTML TAG */

.cm-tag{
    color:#0066cc;
}

/* HTML ATTRIBUTE */

.cm-attribute{
    color:#a31515;
}

/* HTML STRING */

.cm-string{
    color:#008000;
}

/* CSS PROPERTY */

.cm-property{
    color:#005cc5;
}

/* JAVASCRIPT KEYWORD */

.cm-keyword{
    color:#7b1fa2;
}

/* JAVASCRIPT VARIABLE */

.cm-variable{
    color:#111111;
}

/* FUNCTION */

.cm-def{
    color:#795548;
}

/* NUMBER */

.cm-number{
    color:#d84315;
}

/* COMMENT */

.cm-comment{
    color:#777777;
}


/* =========================
   MOBILE BUTTON
========================= */

#mobileFullscreen{

    display:none;

    position:fixed;

    right:10px;
    bottom:10px;

    z-index:5000;

    border:0;

    border-radius:9px;

    background:#111111;

    color:#ffffff;

    padding:11px 15px;

    font-size:14px;

    font-weight:bold;

    box-shadow:
        0 3px 12px
        rgba(0,0,0,.2);

}


/* =========================
   FULL SCREEN RESULT
========================= */

#resultScreen{

    display:none;

    position:fixed;

    inset:0;

    width:100vw;
    height:100vh;

    background:#ffffff;

    z-index:99999;
}


#resultFrame{

    width:100%;
    height:100%;

    border:0;

    background:#ffffff;
}


/* CLOSE */

#closeBtn{

    position:absolute;

    top:10px;
    right:10px;

    width:40px;
    height:40px;

    border:0;

    border-radius:50%;

    background:rgba(0,0,0,.75);

    color:white;

    font-size:25px;

    z-index:100000;

}


/* =========================
   MOBILE
========================= */

@media(max-width:600px){

    #mobileFullscreen{
        display:block;
    }

    .CodeMirror{
        font-size:16px;
    }

    .CodeMirror-linenumber{

}


/* =========================
   COMPUTER
========================= */

@media(min-width:601px){

    #mobileFullscreen{
        display:none;
    }

}

</style>
</head>

<textarea id="code">

<!DOCTYPE html>

<html>

<head>

<style>

body{
    margin:0;
    min-height:100vh;

    display:flex;
    align-items:center;
    justify-content:center;

    font-family:Arial;

    background:#f5f5f5;
}

.box{
    text-align:center;
    padding:40px;

    background:white;

    border-radius:15px;

    box-shadow:
        0 5px 25px
        rgba(0,0,0,.12);
}

h1{
    color:#2196f3;
}

button{
    padding:10px 20px;
    border:0;
    border-radius:8px;
    cursor:pointer;
}

</style>

</head>


<body>

<div class="box">

    <h1>Hello World!</h1>

    <p>Write your code here.</p>

    <button onclick="hello()">
        Click Me
    </button>

</div>


<script>

function hello(){

    alert("JavaScript is working!");

}

<\/script>

</body>

</html>

</textarea>


<!-- MOBILE BUTTON -->

<button
id="mobileFullscreen"
onclick="runFullScreen()">

⛶ Full Screen

</button>


<!-- RESULT -->

<div id="resultScreen">

<button
id="closeBtn"
onclick="closeFullScreen()">

×

</button>

<iframe
id="resultFrame">
</iframe>

</div>


<script>

/* =========================
   CODEMIRROR
========================= */

const editor =
CodeMirror.fromTextArea(
    document.getElementById("code"),
    {

        mode:"htmlmixed",

        lineNumbers:true,

        lineWrapping:false,

        tabSize:2,

        indentUnit:2,

        indentWithTabs:false,

        autofocus:true,

        viewportMargin:Infinity,

        extraKeys:{

            /* SHIFT + ENTER */

            "Shift-Enter":
            function(){

                runFullScreen();

            },

            /* TAB */

            "Tab":
            function(cm){

                cm.replaceSelection("  ");

            }

        }

    }
);


/* =========================
   SAVE
========================= */

const savedCode =
localStorage.getItem("liveCode");


if(savedCode){

    editor.setValue(savedCode);

}


/* AUTO SAVE */

editor.on(
    "change",
    function(){

        localStorage.setItem(
            "liveCode",
            editor.getValue()
        );

    }
);


/* =========================
   RUN FULL SCREEN
========================= */

function runFullScreen(){

    const code =
        editor.getValue();

    const frame =
        document.getElementById(
            "resultFrame"
        );

    const screen =
        document.getElementById(
            "resultScreen"
        );


    frame.srcdoc=code;

    screen.style.display="block";


    /* Browser Fullscreen */

    if(screen.requestFullscreen){

        screen
        .requestFullscreen()
        .catch(()=>{});

    }

}


/* =========================
   CLOSE
========================= */

function closeFullScreen(){

    document.getElementById(
        "resultScreen"
    ).style.display="none";


    if(document.fullscreenElement){

        document
        .exitFullscreen()
        .catch(()=>{});

    }

}


/* =========================
   ESC
========================= */

document.addEventListener(
    "fullscreenchange",
    function(){

        if(!document.fullscreenElement){

            document.getElementById(
                "resultScreen"
            ).style.display="none";

        }

    }
);


/* =========================
   MOBILE BACK
========================= */

history.pushState(
    null,
    null,
    location.href
);


window.addEventListener(
    "popstate",
    function(){

        const screen =
            document.getElementById(
                "resultScreen"
            );

        if(screen.style.display==="block"){

            closeFullScreen();

            history.pushState(
                null,
                null,
                location.href
            );

        }

    }
);

</script>

</body>
</html>
