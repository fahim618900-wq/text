<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Live Code Editor</title>

<link rel="stylesheet"
href="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/lib/codemirror.min.css">

<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/lib/codemirror.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/mode/xml/xml.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/mode/css/css.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/mode/javascript/javascript.js"></script>
<script src="https://cdn.jsdelivr.net/npm/codemirror@5.65.14/mode/htmlmixed/htmlmixed.js">
</script>

<style>
html,body{
    margin:0;
    width:100%;
    height:100%;
    overflow:hidden;
    background:#fff;
}

.CodeMirror{
    position:fixed;
    top:0;
    left:0;
    width:100%;
    height:100vh;

    font-family:Consolas,"Courier New",monospace;
    font-size:16px;
    line-height:1.6;

    background:#fff;
    color:#111;
    border:0;
}

.CodeMirror-gutters{
    background:#f7f7f7;
    border-right:1px solid #ddd;
    color:#999;
}

.CodeMirror-linenumber{
    color:#999;
    padding:0 10px 0 8px;
}

.CodeMirror-activeline-background{
    background:#f8f8f8;
}

.CodeMirror-cursor{
    border-left:2px solid #222;
}

.CodeMirror-selected{
    background:#dbeafe!important;
}

/* Syntax colors */
.cm-tag{color:#06c}
.cm-attribute{color:#a31515}
.cm-string{color:#008000}
.cm-property{color:#005cc5}
.cm-keyword{color:#7b1fa2}
.cm-variable{color:#111}
.cm-def{color:#795548}
.cm-number{color:#d84315}
.cm-comment{color:#777}

/* =========================
   Mobile buttons (iOS style)
========================= */
#mobileButtons{
    display:none;
    position:fixed;
    right:14px;
    bottom:14px;
    z-index:5000;
    gap:8px;
    align-items:center;
}

.roundBtn{
    width:34px;
    height:34px;
    padding:0;

    border:0.5px solid rgba(0,0,0,.05);
    border-radius:50%;

    background:rgba(120,120,128,.13);
    -webkit-backdrop-filter:blur(14px) saturate(180%);
    backdrop-filter:blur(14px) saturate(180%);

    color:#1c1c1e;

    display:flex;
    align-items:center;
    justify-content:center;

    cursor:pointer;
    -webkit-tap-highlight-color:transparent;

    box-shadow:0 1px 2px rgba(0,0,0,.05);

    transition:transform .16s ease, background .16s ease;
}

.roundBtn svg{
    width:16px;
    height:16px;
    display:block;
    pointer-events:none;
}

.roundBtn:hover{
    background:rgba(120,120,128,.20);
}

.roundBtn:active{
    transform:scale(.9);
    background:rgba(120,120,128,.26);
}

/* =========================
   Result screen
========================= */
#resultScreen{
    display:none;

    position:fixed;
    inset:0;

    width:100vw;
    height:100vh;

    background:#fff;
    z-index:99999;
}

#resultFrame{
    width:100%;
    height:100%;
    border:0;
    background:#fff;
}

/* Close button (iOS glass style) */
#closeBtn{
    position:absolute;
    top:12px;
    right:12px;

    width:34px;
    height:34px;
    padding:0;

    border:0.5px solid rgba(0,0,0,.06);
    border-radius:50%;

    background:rgba(255,255,255,.78);
    -webkit-backdrop-filter:blur(16px) saturate(180%);
    backdrop-filter:blur(16px) saturate(180%);

    color:#1c1c1e;

    display:flex;
    align-items:center;
    justify-content:center;

    z-index:100000;
    cursor:pointer;
    -webkit-tap-highlight-color:transparent;

    box-shadow:0 2px 8px rgba(0,0,0,.14);

    transition:transform .16s ease, background .16s ease;
}

#closeBtn svg{
    width:15px;
    height:15px;
    display:block;
    pointer-events:none;
}

#closeBtn:active{
    transform:scale(.9);
    background:rgba(255,255,255,.95);
}

/* Mobile */
@media(max-width:600px){

    #mobileButtons{
        display:flex;
    }

    .CodeMirror{
        font-size:16px;
    }

    .CodeMirror-linenumber{
        padding-right:8px;
        padding-left:5px;
    }
}

/* Computer */
@media(min-width:601px){

    #mobileButtons{
        display:none;
    }
}
</style>
</head>

<body>

<textarea id="code"><!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>My Page</title>

    <style>
        body{
            font-family:Arial;
            text-align:center;
            padding:40px;
        }

        h1{
            color:#0066cc;
        }
    </style>
</head>

<body>

    <h1>Hello World!</h1>
    <p>এখানে HTML, CSS এবং JavaScript একসাথে লিখুন।</p>

    <script>
        console.log("Hello!");
    </script>

</body>
</html></textarea>


<!-- MOBILE BUTTONS -->
<div id="mobileButtons">

    <!-- Full Screen -->
    <button
        class="roundBtn"
        onclick="runFullScreen()"
        title="Full Screen"
        aria-label="Full Screen">

        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor"
             stroke-width="1.7"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M8 3H5a2 2 0 0 0-2 2v3"/>
            <path d="M16 3h3a2 2 0 0 1 2 2v3"/>
            <path d="M16 21h3a2 2 0 0 0 2-2v-3"/>
            <path d="M8 21H5a2 2 0 0 1-2-2v-3"/>
        </svg>

    </button>

    <!-- Download -->
    <button
        class="roundBtn"
        onclick="downloadCode()"
        title="Download"
        aria-label="Download">

        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor"
             stroke-width="1.7"
             stroke-linecap="round"
             stroke-linejoin="round">
            <path d="M12 4v10"/>
            <path d="M7.5 10.5 12 15l4.5-4.5"/>
            <path d="M5 19h14"/>
        </svg>

    </button>

</div>


<!-- RESULT -->
<div id="resultScreen">

    <button
        id="closeBtn"
        onclick="closeFullScreen()"
        title="Close"
        aria-label="Close">

        <svg viewBox="0 0 24 24" fill="none"
             stroke="currentColor"
             stroke-width="1.8"
             stroke-linecap="round">
            <path d="M6 6l12 12"/>
            <path d="M18 6L6 18"/>
        </svg>

    </button>

    <iframe id="resultFrame"></iframe>

</div>


<script>

const editor = CodeMirror.fromTextArea(
    document.getElementById("code"),
    {
        mode:"htmlmixed",

        lineNumbers:true,
        lineWrapping:false,

        tabSize:2,
        indentUnit:2,
        indentWithTabs:false,

        autofocus:true,
        viewportMargin:Infinity,

        extraKeys:{

            /* Computer: Shift + Enter */
            "Shift-Enter":function(){
                runFullScreen();
            },

            /* Tab = 2 spaces */
            "Tab":function(cm){
                cm.replaceSelection("  ");
            },

            /*
             * Computer: Ctrl + D
             *
             * Browser-এর default Ctrl+D
             * bookmark করার কাজ বন্ধ করে
             * Download চালাবে।
             */
            "Ctrl-D":function(){
                downloadCode();
            }

        }
    }
);


/* Auto Save */
const savedCode = localStorage.getItem("liveCode");

if(savedCode){
    editor.setValue(savedCode);
}

editor.on("change",function(){
    localStorage.setItem(
        "liveCode",
        editor.getValue()
    );
});


/* =========================
   RUN FULL SCREEN
========================= */

function runFullScreen(){

    const code = editor.getValue();

    const frame =
        document.getElementById("resultFrame");

    const screen =
        document.getElementById("resultScreen");

    frame.srcdoc = code;

    screen.style.display = "block";

    /*
     * Browser Fullscreen
     */
    if(screen.requestFullscreen){

        screen.requestFullscreen()
        .catch(function(){
            /* Browser fullscreen না দিলেও
               overlay fullscreen থাকবে */
        });

    }
}


/* =========================
   CLOSE RESULT
========================= */

function closeFullScreen(){

    document.getElementById(
        "resultScreen"
    ).style.display = "none";

    if(document.fullscreenElement){

        document.exitFullscreen()
        .catch(function(){});

    }
}


/* =========================
   DOWNLOAD
========================= */

function downloadCode(){

    const code = editor.getValue();

    /*
     * নাম চাইবে
     */
    let fileName = prompt(
        "ফাইলের নাম লিখুন:",
        "index"
    );

    /*
     * Cancel করলে কিছু হবে না
     */
    if(fileName === null){
        return;
    }

    fileName = fileName.trim();

    /*
     * নাম খালি হলে বন্ধ
     */
    if(fileName === ""){
        alert("একটি ফাইলের নাম দিন।");
        return;
    }

    /*
     * ব্যবহারকারী .html লিখলেও
     * আবার .html যোগ হবে না
     */
    if(!fileName.toLowerCase().endsWith(".html")){
        fileName += ".html";
    }

    const blob = new Blob(
        [code],
        {
            type:"text/html;charset=utf-8"
        }
    );

    const url =
        URL.createObjectURL(blob);

    const a =
        document.createElement("a");

    a.href = url;
    a.download = fileName;

    document.body.appendChild(a);

    a.click();

    a.remove();

    setTimeout(function(){

        URL.revokeObjectURL(url);

    },1000);
}


/* =========================
   FULLSCREEN CHANGE
========================= */

document.addEventListener(
    "fullscreenchange",
    function(){

        if(!document.fullscreenElement){

            document.getElementById(
                "resultScreen"
            ).style.display = "none";

        }

    }
);


/* =========================
   MOBILE BACK BUTTON
========================= */

history.pushState(
    null,
    null,
    location.href
);

window.addEventListener(
    "popstate",
    function(){

        const screen =
            document.getElementById(
                "resultScreen"
            );

        if(screen.style.display === "block"){

            closeFullScreen();

            history.pushState(
                null,
                null,
                location.href
            );

        }

    }
);

</script>

</body>
</html>
